<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>流式聊天演示 · Day1</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #1c1c1a; color: #e8e6df;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
  }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 6px; }
  .sub { color: #b4b2a9; margin: 0 0 20px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1; min-width: 240px; padding: 10px 12px;
    background: #26262a; color: #e8e6df; border: 1px solid #444441;
    border-radius: 8px; font-size: 14px;
  }
  button {
    padding: 10px 18px; border-radius: 8px; border: 1px solid #3b6d11;
    background: #27500a; color: #c0dd97; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  label { display: flex; align-items: center; gap: 6px; color: #b4b2a9; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .panels { grid-template-columns: 1fr; } }
  section {
    background: #26262a; border: 1px solid #444441; border-radius: 10px;
    padding: 12px 14px; min-height: 220px; display: flex; flex-direction: column;
  }
  h2 { font-size: 12px; font-weight: 500; margin: 0 0 10px; letter-spacing: .04em; }
  .r h2 { color: #afa9ec; }
  .c h2 { color: #85b7eb; }
  pre {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 1.7;
    flex: 1; overflow-y: auto; max-height: 46vh;
  }
  .r pre { color: #cecbf6; }
  .c pre { color: #e8e6df; }
  #status { margin-top: 14px; color: #b4b2a9; font-size: 13px; min-height: 20px; }
</style>
</head>
<body>
  <h1>流式聊天演示</h1>
  <p class="sub">同一句话，被拆成两条流：<b>reasoning</b>（思维链）与 <b>content</b>（正式回答）。页面自己解析 SSE 并把碎片拼起来。</p>

  <div class="bar">
    <input id="msg" type="text" value="用一句话介绍你自己" />
    <button id="send">发送</button>
    <label><input type="checkbox" id="useStream" checked /> 流式</label>
  </div>

  <div class="panels">
    <section class="r"><h2>REASONING · 思维链</h2><pre id="reasoning"></pre></section>
    <section class="c"><h2>CONTENT · 正式回答</h2><pre id="content"></pre></section>
  </div>

  <p id="status">就绪</p>

<script>
const $ = (id) => document.getElementById(id);
let busy = false;

async function send() {
  if (busy) return;
  const message = $('msg').value.trim();
  if (!message) return;

  busy = true;
  $('send').disabled = true;
  $('reasoning').textContent = '';
  $('content').textContent = '';
  $('status').textContent = '请求中…';

  try {
    if ($('useStream').checked) {
      await runStream(message);
    } else {
      await runOnce(message);
    }
  } catch (e) {
    $('status').textContent = '出错：' + e.message;
  } finally {
    busy = false;
    $('send').disabled = false;
  }
}

async function runOnce(message) {
  const r = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message }),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  $('reasoning').textContent = data.reasoning || '(无思维链)';
  $('content').textContent = data.reply;
  $('status').textContent = '完成 · 非流式 · 模型 ' + data.model;
}

async function runStream(message) {
  const r = await fetch('/api/chat/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message }),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);

  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let nEvents = 0;
  let finished = false;

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    // SSE 事件之间以空行分隔
    let idx;
    while ((idx = buffer.indexOf('\n\n')) >= 0) {
      const raw = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);

      for (const line of raw.split('\n')) {
        if (!line.startsWith('data:')) continue;
        const obj = JSON.parse(line.slice(5).trim());
        nEvents += 1;

        if (obj.done) { finished = true; continue; }
        if (obj.type === 'reasoning') $('reasoning').textContent += obj.delta;
        else if (obj.type === 'content') $('content').textContent += obj.delta;
        else if (obj.type === 'error') throw new Error(obj.error);
      }
    }
  }

  $('status').textContent = finished
    ? '完成 · 流式 · 共收到 ' + nEvents + ' 个 SSE 事件'
    : '连接中断';
}

$('send').addEventListener('click', send);
$('msg').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
